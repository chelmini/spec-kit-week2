<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quote of the Day</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <main class="page">
    <h1 class="page__title">Quote of the Day</h1>

    <section class="quote-card" aria-live="polite">
      <blockquote class="quote-card__text" id="quote-text"></blockquote>
      <p class="quote-card__author" id="quote-author"></p>
    </section>

    <div class="controls">
      <button type="button" id="new-quote-button">New quote</button>
      <button type="button" id="favorite-toggle" class="favorite-toggle is-secondary" aria-pressed="false">
        Favorite
      </button>
      <button type="button" id="view-favorites-button" class="is-secondary">View favorites</button>
    </div>

    <section id="favorites-view" class="favorites-view" hidden>
      <h2>Favorites</h2>
      <p class="favorites-empty" hidden>No favorites yet.</p>
      <ul class="favorites-list"></ul>
    </section>
  </main>

  <script src="js/quotes.js"></script>
  <script src="js/quoteSelector.js"></script>
  <script src="js/favoritesStore.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
